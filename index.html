<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AfriConnect</title>
<style>
:root{--brand:#0866ff;--brand-d:#0652cc;--bg:#e4e6eb;--card:#fff;--ink:#1b1f2a;--mut:#667085;--line:#e3e6ec;--soft:#e7f0fe;--red:#d6336c;--g:#0a7d3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
.top h1{margin:0;font-size:30px;flex:1;color:var(--brand);font-weight:800;letter-spacing:-1.5px}
.top .ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);color:var(--ink);display:grid;place-items:center}
.top .ib svg{width:22px;height:22px}
.top{position:relative;z-index:8}
.menu{position:absolute;right:10px;top:calc(56px + env(safe-area-inset-top));background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.2);min-width:210px;padding:6px;z-index:20}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px;border-radius:8px;font-weight:600;font-size:16px}
.menu button:active{background:var(--bg)}
.wrap{max-width:620px;margin:0 auto;padding:0 0 60px}
.card{background:var(--card);border-radius:0;padding:12px;margin-bottom:8px}
.auth .card{border-radius:14px}
.auth{max-width:420px;margin:7vh auto 0;padding:0 16px}
.auth .logo{font-size:36px;font-weight:800;color:var(--brand);text-align:center;letter-spacing:-1px}
.auth p.sub{text-align:center;color:var(--mut);margin:2px 0 14px}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=email],input[type=password],textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--brand)}
textarea{resize:none;min-height:64px}
.btn{width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700;margin-top:14px}
.btn:disabled{opacity:.55}
.link{background:none;border:0;color:var(--brand);font-weight:700;padding:8px;width:100%;margin-top:6px}
.err{color:var(--red);font-weight:600;font-size:14px;margin:8px 0 0;min-height:1em}
.row{display:flex;gap:10px;align-items:center}
.av{border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;object-fit:cover;overflow:hidden}
a.who{color:inherit;text-decoration:none}
.name{font-weight:700}
.time{font-size:13px;color:var(--mut)}
.body{white-space:pre-wrap;word-wrap:break-word;margin:10px 0 0}
.img{width:calc(100% + 24px);margin:10px -12px 0;display:block;max-height:640px;object-fit:cover;background:var(--soft)}
.stats{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:10px}
.acts{display:flex;border-top:1px solid var(--line);margin-top:8px;padding-top:4px;gap:4px}
.acts button{flex:1;background:none;border:0;padding:9px 2px;border-radius:10px;color:var(--mut);font-weight:700;font-size:14px;white-space:nowrap}
.acts button.on{color:var(--brand)}
.acts button:active{background:var(--bg)}
.cm{margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.c{display:flex;gap:8px;margin-bottom:8px}
.bub{background:var(--bg);border-radius:16px;padding:7px 12px;font-size:15px;word-wrap:break-word;min-width:0}
.bub b{display:block;font-size:13px}
.del{background:none;border:0;color:var(--mut);font-size:12px;padding:0 0 0 8px}
.cin{display:flex;gap:6px}
.cin input{flex:1;border-radius:20px}
.cin button{background:var(--brand);color:#fff;border:0;border-radius:20px;padding:0 14px;font-weight:700}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px}
.tools .ph{background:var(--soft);color:var(--brand);border:0;border-radius:10px;padding:9px 12px;font-weight:700}
.tools .go{margin-left:auto;background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 20px;font-weight:700}
.tools .go:disabled{opacity:.5}
.prev{position:relative;margin-top:8px}
.prev img{width:100%;border-radius:12px;max-height:260px;object-fit:cover;display:block}
.prev button{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:30px;height:30px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.hide{display:none!important}
.nav{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:7;background:#fff;border-bottom:1px solid var(--line);display:flex}
.nav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:11px 0 9px;color:#4b4f56;text-decoration:none;font-size:0;border-bottom:3px solid transparent}
.nav a svg{width:27px;height:27px}
.nav a.on{color:var(--brand);border-bottom-color:var(--brand)}
.bd{position:absolute;top:2px;left:calc(50% + 4px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}
.cover{height:130px;border-radius:0;background:linear-gradient(135deg,#1d6ff2,#0a7d3b 60%,#f2b01d);margin:-12px -12px 0}
.pf{display:flex;flex-direction:column;align-items:center;margin-top:-52px;text-align:center}
.pf .av{border:4px solid #fff}
.pf h2{margin:8px 0 2px;font-size:22px}
.pf p{margin:4px 0 0;color:var(--mut);max-width:420px;word-wrap:break-word}
.pf .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.pf .btns button{background:var(--soft);color:var(--brand);border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.mem{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.mem:last-child{border-bottom:0}
.mem .info{flex:1;min-width:0}
.mem .bio{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fa{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fa button{border:0;border-radius:9px;padding:7px 12px;font-weight:700;font-size:14px;background:var(--soft);color:var(--brand)}
.fa button.p{background:var(--brand);color:#fff}
.fa button.g{background:var(--bg);color:var(--mut)}
.fa button:disabled{opacity:.5}
h3.sec{margin:6px 4px 8px;font-size:17px}
.conv{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.conv:last-child{border-bottom:0}
.conv .info{flex:1;min-width:0}
.conv .pv{font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv.un .pv{color:var(--ink);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--brand);flex:none}
.chat{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:300px}
.chat .hd{display:flex;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.chat .hd a{color:var(--brand);text-decoration:none;font-size:22px;font-weight:700;padding:0 6px}
.msgs{flex:1;overflow-y:auto;padding:10px 2px;display:flex;flex-direction:column;gap:6px}
.m{max-width:80%;padding:8px 12px;border-radius:18px;background:var(--bg);word-wrap:break-word;white-space:pre-wrap;align-self:flex-start}
.m.me{background:var(--brand);color:#fff;align-self:flex-end}
.m small{display:block;font-size:11px;opacity:.65;margin-top:2px}
.send{display:flex;gap:6px;padding-top:8px;border-top:1px solid var(--line)}
.send input{flex:1;border-radius:22px}
.send button{background:var(--brand);color:#fff;border:0;border-radius:22px;padding:0 18px;font-weight:700}
.nt{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.nt:last-child{border-bottom:0}
.nt.un{background:var(--soft);border-radius:10px}
.nt .t{flex:1;min-width:0;font-size:15px}

.cmp{display:flex;gap:10px;align-items:center}
.pill{flex:1;text-align:left;background:var(--bg);border:0;border-radius:24px;padding:12px 16px;font-size:17px;color:#4b4f56}
.phb{background:none;border:0;display:grid;place-items:center;color:#2eb85c;font-size:11px;font-weight:600;gap:0;padding:0 4px}
.phb svg{width:34px;height:34px}
.exp{margin-top:8px}
.stories{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;margin-bottom:8px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{flex:none;width:112px;height:190px;border-radius:14px;position:relative;overflow:hidden;background:var(--soft) center/cover;border:1px solid var(--line);cursor:pointer}
.st .nm{position:absolute;left:8px;right:8px;bottom:8px;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st .ring{position:absolute;top:8px;left:8px;border:4px solid var(--brand);border-radius:50%}
.st.mk{background:#fff}
.st.mk .top2{height:130px;background:center/cover var(--soft)}
.st.mk .plus{position:absolute;top:112px;left:50%;margin-left:-20px;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;border:4px solid #fff;display:grid;place-items:center;font-size:26px;line-height:1}
.st.mk .nm{color:var(--ink);text-shadow:none;text-align:center;bottom:8px;white-space:normal;font-size:14px;line-height:1.15}
.sv{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.sv img{flex:1;min-height:0;width:100%;object-fit:contain}
.sv .hd{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 24px;display:flex;gap:10px;align-items:center;color:#fff;background:linear-gradient(#000a,#0000)}
.sv .hd button{background:none;border:0;color:#fff;font-size:28px;margin-left:auto}
.sv .bar{display:flex;gap:4px;position:absolute;top:calc(4px + env(safe-area-inset-top));left:8px;right:8px}
.sv .bar i{flex:1;height:3px;background:#fff5;border-radius:2px}
.sv .bar i.on{background:#fff}
.more{background:none;border:0;font-size:22px;color:var(--mut);padding:0 6px;letter-spacing:1px}
</style>
</head>
<body>

<div id="auth" class="auth hide">
  <div class="card">
    <div class="logo">AfriConnect</div>
    <p class="sub" id="authSub">Connecte-toi pour retrouver tes amis.</p>
    <div id="nameBox" class="hide"><label for="fName">Ton nom</label><input id="fName" type="text" maxlength="40" autocomplete="name"></div>
    <label for="fMail">E-mail</label><input id="fMail" type="email" autocomplete="email" inputmode="email">
    <label for="fPass">Mot de passe (6 caractères minimum)</label><input id="fPass" type="password" autocomplete="current-password">
    <p class="err" id="authErr"></p>
    <button class="btn" id="authGo" type="button">Se connecter</button>
    <button class="link" id="authSwitch" type="button">Pas de compte ? Créer un compte</button>
  </div>
</div>

<div id="app" class="hide">
  <div class="top"><h1>africonnect</h1>
    <button class="ib" id="bPlus" type="button" aria-label="Publier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></button>
    <button class="ib" id="bSearch" type="button" aria-label="Chercher"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="ib" id="bMenu" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
  <div class="menu hide" id="menu">
    <button type="button" id="mProf">👤 Mon profil</button>
    <button type="button" id="mRef">🔄 Actualiser</button>
    <button type="button" id="mOut">🚪 Se déconnecter</button>
  </div>
  <nav class="nav">
    <a href="#/" data-r="home" aria-label="Accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></a>
    <a href="#/membres" data-r="members" aria-label="Membres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17.5 14c2.5 0 4 1.7 4 4.5"/></svg></a>
    <a href="#/messages" data-r="msgs" aria-label="Messages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg><span class="bd hide" id="bd-msgs"></span></a>
    <a href="#/alertes" data-r="alerts" aria-label="Alertes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="bd hide" id="bd-alerts"></span></a>
    <a href="#/profil" data-r="profile" aria-label="Profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg></a>
  </nav>
  <div class="wrap" id="main"></div>
</div>

<div id="setup" class="auth hide"><div class="card"><div class="logo">AfriConnect</div><p class="sub">La base n'est pas encore reliée.</p></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SUPA_URL = "https://edsvhqwetulvypocdjku.supabase.co";
var SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkc3ZocXdldHVsdnlwb2Nkamt1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzQ0OTcsImV4cCI6MjEwODk1MDQ5N30.0opGuYQPIc0hZQlUNlCk9h8kPXD-G4IdaAge2ioiKTM";
var AI_URL = "";

var $ = function (id) { return document.getElementById(id); };
var rid = 0, sb = null, me = null, prof = { name: "", avatar_url: null, bio: "" }, mode = "login", busy = false, open = {}, timer = null, badgeTimer = null, fr = [];
var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
var POST_SEL = "id,body,image_url,created_at,user_id,profiles!posts_user_id_fkey(name,avatar_url),likes(user_id),comments(id,body,created_at,user_id,profiles!comments_user_id_fkey(name,avatar_url))";

function h(tag, props, kids) {
  var e = document.createElement(tag);
  for (var k in (props || {})) {
    if (k === "text") e.textContent = props[k];
    else if (k === "cls") e.className = props[k];
    else if (k.slice(0, 2) === "on") e[k] = props[k];
    else e.setAttribute(k, props[k]);
  }
  (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}
function ago(iso) {
  var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return "à l'instant";
  if (s < 3600) return Math.floor(s / 60) + " min";
  if (s < 86400) return Math.floor(s / 3600) + " h";
  if (s < 604800) return Math.floor(s / 86400) + " j";
  return new Date(iso).toLocaleDateString("fr-FR");
}
function ini(n) { return (n || "?").trim().charAt(0).toUpperCase() || "?"; }
function avEl(p, size) {
  var st = "width:" + size + "px;height:" + size + "px;font-size:" + Math.round(size * 0.42) + "px";
  if (p && p.avatar_url) return h("img", { cls: "av", src: p.avatar_url, alt: "", style: st });
  return h("div", { cls: "av", text: ini(p && p.name), style: st });
}
function frErr(m) {
  m = String(m || "");
  if (/Invalid login/i.test(m)) return "E-mail ou mot de passe incorrect.";
  if (/already registered|already been registered/i.test(m)) return "Cet e-mail a déjà un compte. Connecte-toi.";
  if (/Password should be/i.test(m)) return "Mot de passe trop court (6 caractères minimum).";
  if (/valid email|invalid format|Unable to validate email/i.test(m)) return "Adresse e-mail invalide.";
  if (/rate limit|too many/i.test(m)) return "Trop d'essais. Réessaie dans quelques minutes.";
  if (/Email not confirmed/i.test(m)) return "E-mail non confirmé : désactive « Confirm email » dans Supabase.";
  if (/Failed to fetch|NetworkError|network/i.test(m)) return "Pas de connexion. Réessaie.";
  if (/relation .* does not exist|schema cache/i.test(m)) return "La base n'est pas à jour : lance le script SQL de la version 3.";
  return m || "Une erreur est survenue.";
}
function show(which) {
  ["auth", "app", "setup"].forEach(function (k) { $(k).classList.toggle("hide", k !== which); });
}

/* ---------- Connexion / inscription ---------- */
function setMode(m) {
  mode = m;
  var su = m === "signup";
  $("nameBox").classList.toggle("hide", !su);
  $("authGo").textContent = su ? "Créer mon compte" : "Se connecter";
  $("authSwitch").textContent = su ? "J'ai déjà un compte" : "Pas de compte ? Créer un compte";
  $("authSub").textContent = su ? "Crée ton compte gratuit en 30 secondes." : "Connecte-toi pour retrouver tes amis.";
  $("fPass").autocomplete = su ? "new-password" : "current-password";
  $("authErr").textContent = "";
}
async function doAuth() {
  var mail = $("fMail").value.trim(), pass = $("fPass").value, nm = $("fName").value.trim();
  $("authErr").textContent = "";
  if (!mail || !pass) { $("authErr").textContent = "Remplis l'e-mail et le mot de passe."; return; }
  if (mode === "signup" && nm.length < 2) { $("authErr").textContent = "Écris ton nom (2 lettres minimum)."; return; }
  $("authGo").disabled = true;
  try {
    var r;
    if (mode === "signup") r = await sb.auth.signUp({ email: mail, password: pass, options: { data: { name: nm } } });
    else r = await sb.auth.signInWithPassword({ email: mail, password: pass });
    if (r.error) throw r.error;
    if (!r.data.session) { $("authErr").textContent = "Compte créé. Si rien ne se passe, désactive « Confirm email » dans Supabase."; return; }
    await enter(r.data.session.user);
  } catch (e) { $("authErr").textContent = frErr(e.message); }
  finally { $("authGo").disabled = false; }
}
async function enter(user) {
  me = user;
  var r = await sb.from("profiles").select("name,avatar_url,bio").eq("id", user.id).maybeSingle();
  var d = r.data || {};
  prof = { name: d.name || (user.user_metadata && user.user_metadata.name) || "Membre", avatar_url: d.avatar_url || null, bio: d.bio || "" };
  show("app");
  route();
  refreshBadges();
  clearInterval(badgeTimer);
  badgeTimer = setInterval(refreshBadges, 30000);
}

/* ---------- Photos ---------- */
function shrink(file, max, q) {
  return new Promise(function (ok, ko) {
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      var w = im.width, hh = im.height, k = Math.min(1, max / Math.max(w, hh));
      var c = document.createElement("canvas"); c.width = Math.round(w * k); c.height = Math.round(hh * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { b ? ok(b) : ko(new Error("Photo illisible.")); }, "image/jpeg", q);
    };
    im.onerror = function () { URL.revokeObjectURL(url); ko(new Error("Photo illisible.")); };
    im.src = url;
  });
}
async function upload(blob, tag) {
  var path = me.id + "/" + tag + Date.now() + ".jpg";
  var up = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
  if (up.error) throw up.error;
  return sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
}

/* ---------- Amis, badges ---------- */
async function loadFr() {
  var r = await sb.from("friendships").select("id,requester,addressee,status");
  fr = r.data || [];
}
function relOf(id) {
  for (var i = 0; i < fr.length; i++) {
    var f = fr[i];
    if (f.requester === me.id && f.addressee === id) return { row: f, state: f.status === "accepted" ? "friends" : "sent" };
    if (f.requester === id && f.addressee === me.id) return { row: f, state: f.status === "accepted" ? "friends" : "received" };
  }
  return { row: null, state: "none" };
}
function friendActions(id, done) {

    h("div", { cls: "hd" }, [h("a", { href: "#/messages", text: "‹" }), h("a", { cls: "who", href: "#/profil/" + id }, [avEl(pr, 38)]), h("div", { cls: "name", text: pr.name })]),
    msgs,
    h("div", { cls: "send" }, [inp, send])
  ]);
  main.appendChild(card);
  var key = "";
  async function load(force) {
    var pair = "and(sender.eq." + me.id + ",receiver.eq." + id + "),and(sender.eq." + id + ",receiver.eq." + me.id + ")";
    var r = await sb.from("messages").select("id,sender,body,created_at,read").or(pair).order("created_at", { ascending: true }).limit(200);
    if (my !== rid || r.error) return;
    var k = r.data.length + ":" + (r.data.length ? r.data[r.data.length - 1].id : 0);
    if (k !== key || force) {
      var near = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight < 80 || !key;
      key = k; msgs.textContent = "";
      if (!r.data.length) msgs.appendChild(h("div", { cls: "empty", text: "Dis bonjour à " + pr.name.split(" ")[0] + " 👋" }));
      r.data.forEach(function (m) {
        msgs.appendChild(h("div", { cls: "m" + (m.sender === me.id ? " me" : "") }, [document.createTextNode(m.body), h("small", { text: ago(m.created_at) })]));
      });
      if (near) msgs.scrollTop = msgs.scrollHeight;
    }
    if (r.data.some(function (m) { return m.sender === id && !m.read; })) {
      await sb.from("messages").update({ read: true }).eq("receiver", me.id).eq("sender", id).eq("read", false);
      refreshBadges();
    }
  }
  async function doSend() {
    var t = inp.value.trim(); if (!t) return;
    send.disabled = true;
    var r = await sb.from("messages").insert({ receiver: id, body: t });
    send.disabled = false;
    if (r.error) { alert(frErr(r.error.message)); return; }
    inp.value = ""; await load(true); msgs.scrollTop = msgs.scrollHeight;
  }
  send.onclick = doSend;
  inp.onkeydown = function (e) { if (e.key === "Enter") doSend(); };
  await load(true);
  msgs.scrollTop = msgs.scrollHeight;
  timer = setInterval(function () { if (!document.hidden) load(false); }, 4000);
}

/* ---------- Notifications ---------- */
async function viewAlerts(main) {
  var my = rid;
  main.appendChild(h("h3", { cls: "sec", text: "Notifications" }));
  var card = h("div", { cls: "card" }); main.appendChild(card);
  var r = await sb.from("notifications").select("id,kind,post_id,created_at,read,actor,profiles!notifications_actor_fkey(name,avatar_url)").order("created_at", { ascending: false }).limit(60);
  if (my !== rid) return;
  if (r.error) { card.appendChild(h("div", { cls: "empty", text: frErr(r.error.message) })); return; }
  if (!r.data.length) { card.appendChild(h("div", { cls: "empty", text: "Rien de nouveau pour l'instant. Les j'aime, commentaires et invitations apparaîtront ici." })); return; }
  var txt = { like: "a aimé ta publication.", comment: "a commenté ta publication.", invite: "t'a envoyé une invitation.", accept: "a accepté ton invitation." };
  r.data.forEach(function (n) {
    var a = n.profiles || { name: "Quelqu'un" };
    var t = h("div", { cls: "t" }, [h("b", { text: a.name }), document.createTextNode(" " + (txt[n.kind] || "")), h("div", { cls: "time", text: ago(n.created_at) })]);
    card.appendChild(h("div", { cls: "nt" + (n.read ? "" : " un"), onclick: function () {
      location.hash = n.kind === "invite" ? "#/membres" : n.kind === "accept" ? "#/profil/" + n.actor : "#/";
    } }, [avEl(a, 44), t]));
  });
  await sb.from("notifications").update({ read: true }).eq("user_id", me.id).eq("read", false);
  refreshBadges();
}

/* ---------- Démarrage ---------- */
async function start() {
  if (!SUPA_URL || !SUPA_KEY || !window.supabase) { show("setup"); return; }
  sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  $("authSwitch").onclick = function () { setMode(mode === "login" ? "signup" : "login"); };
  $("authGo").onclick = doAuth;
  $("fPass").onkeydown = function (e) { if (e.key === "Enter") doAuth(); };
  var menu = $("menu");
  $("bMenu").onclick = function (e) { e.stopPropagation(); menu.classList.toggle("hide"); };
  document.addEventListener("click", function () { menu.classList.add("hide"); });
  $("mProf").onclick = function () { location.hash = "#/profil"; };
  $("mRef").onclick = function () { route(); refreshBadges(); };
  $("mOut").onclick = async function () { await sb.auth.signOut(); me = null; clearInterval(timer); clearInterval(badgeTimer); show("auth"); setMode("login"); };
  $("bPlus").onclick = function () {
    if (location.hash && location.hash !== "#/") location.hash = "#/";
    setTimeout(function () { var p = document.getElementById("pill"); window.scrollTo(0, 0); if (p) p.click(); }, 60);
  };
  $("bSearch").onclick = function () {
    location.hash = "#/membres";
    setTimeout(function () { var q = document.querySelector("#main input[type=text]"); if (q) q.focus(); }, 300);
  };
  window.addEventListener("hashchange", route);
  var s = await sb.auth.getSession();
  if (s.data.session) await enter(s.data.session.user); else { show("auth"); setMode("login"); }
}
start();
</script>
