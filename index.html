<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfriConnect</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f0f2f5; }
        /* Barre de navigation basse (style mobile) */
        .nav-bar {
            position: fixed; bottom: 0; width: 100%; background: white;
            display: flex; justify-content: space-around; padding: 10px 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        }
        .nav-item { text-align: center; cursor: pointer; color: #65676b; font-size: 14px; }
        .nav-item.active { color: #1877f2; font-weight: bold; }
        
        /* Contenu des onglets */
        .tab-content { display: none; padding: 20px; padding-bottom: 70px; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <!-- Onglet 1 : Accueil -->
    <div id="tab-accueil" class="tab-content active">
        <h2>Fil d'actualité AfriConnect</h2>
        <p>Ici s'affichent les publications des utilisateurs.</p>
    </div>

    <!-- Onglet 2 : Vidéos / Reels -->
    <div id="tab-videos" class="tab-content">
        <h2>Vidéos et Reels</h2>
        <p>Espace dédié aux vidéos de la communauté.</p>
    </div>

    <!-- Onglet 3 : Boutique (Marketplace) -->
    <div id="tab-boutique" class="tab-content">
        <h2>Boutique AfriConnect</h2>
        <p>Découvrez les produits en vente près de chez vous !</p>
    </div>

    <!-- Barre de navigation en bas -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="changerOnglet('accueil', this)">🏠 Accueil</div>
        <div class="nav-item" onclick="changerOnglet('videos', this)">🎬 Vidéos</div>
        <div class="nav-item" onclick="changerOnglet('boutique', this)">🛍️ Boutique</div>
    </div>

    <script>
        // Fonction pour basculer d'un onglet à l'autre
        function changerOnglet(nomOnglet, element) {
            // Cacher tous les onglets
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            // Retirer la classe active de tous les boutons
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            // Afficher l'onglet choisi et activer le bouton
            document.getElementById('tab-' + nomOnglet).classList.add('active');
            element.classList.add('active');
        }
    </script>

</body>
</html>
